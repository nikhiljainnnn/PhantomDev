name: CI — Lint, Test, Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. Lint & type check
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: pip install ruff==0.6.9 mypy==1.11.2 pydantic==2.9.2

      - name: Ruff lint
        run: ruff check agents/ api/ orchestrator/ worker/ evaluation/ tools/ scripts/ --ignore F401,DTZ003,BLE001,TRY401,S110,PIE810,E402

      - name: Ruff format check
        run: ruff format --check agents/ api/ orchestrator/ worker/ evaluation/ tools/ scripts/

  # ─────────────────────────────────────────────────────────────────
  # 2. Backend tests
  # ─────────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage
        env:
          REDIS_URL: redis://localhost:6379/0
          WORKSPACE_DIR: /tmp/phantomdev_test_workspace
          CHROMA_PERSIST_DIR: /tmp/phantomdev_test_chroma
          SANDBOX_DIR: /tmp/phantomdev_test_sandbox
          USE_CELERY: "false"
          # Dummy values so imports don't fail
          GROQ_API_KEY: ""
          OPENAI_API_KEY: ""
          GITHUB_TOKEN: ""
        run: |
          pytest tests/ \
            --tb=short \
            --cov=agents \
            --cov=api \
            --cov=orchestrator \
            --cov=worker \
            --cov=evaluation \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=40 \
            -q

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────────────
  # 3. Security scanning (SAST + dependency CVEs)
  # ─────────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # for uploading SARIF

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install security tools
        run: pip install bandit==1.7.10 safety==3.2.8

      - name: Bandit SAST (HIGH severity fails CI)
        run: |
          bandit -r agents/ api/ orchestrator/ worker/ evaluation/ tools/ \
            -f sarif \
            -o bandit-results.sarif \
            --severity-level high \
            || true
          if [ ! -f bandit-results.sarif ]; then
            echo '{"version": "2.1.0", "runs": [{"tool": {"driver": {"name": "Bandit"}}, "results": []}]}' > bandit-results.sarif
          fi
          bandit -r agents/ api/ orchestrator/ worker/ evaluation/ tools/ \
            --severity-level high \
            --exit-zero \
            -q

      - name: Upload Bandit SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit

      - name: Safety dependency CVE check
        run: |
          safety check -r requirements.txt --json --output safety-report.json || true
          safety check -r requirements.txt || true

      - name: Upload Safety report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-report
          path: safety-report.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # 4. Frontend build
  # ─────────────────────────────────────────────────────────────────
  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build Vite bundle
        working-directory: frontend
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # 5. Docker build validation (no push)
  # ─────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: false
          tags: phantomdev:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
